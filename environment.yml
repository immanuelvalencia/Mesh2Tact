# Portable Conda specification for Linux and Windows.
# Install matching torch and torchvision separately for training and Predict.
name: torch_gpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - scipy>=1.11
  - trimesh>=4.0
  - opencv>=4.9
  - pyyaml>=6.0
  - pillow
  - matplotlib
  - pyvista>=0.44
  - pyvistaqt
  - pyqt
  - qtpy
  - pytest
  - scikit-image
  - scikit-learn
